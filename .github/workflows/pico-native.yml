name: Build Pico native DeSmuME packages

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'getBoolean/emucap'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.revision }}
      - name: Restore canonical checkout bytes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config core.autocrlf false
          git rm --cached -r .
          git reset --hard HEAD
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git base-devel util-linux patch perl curl tar xz
            mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib mingw-w64-x86_64-python
            mingw-w64-x86_64-meson mingw-w64-x86_64-glib2
      - name: Build and package locked Linux native source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python _tests/release/pico_native_tests.py
          bash _tests/release/native_unix_build.sh desmume-nds . 2>&1 | tee native-build.log
          python _tests/native/nds-mpcf-status.py
          python _tests/release/pico_native.py --platform linux
      - name: Build and package locked Windows native source
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          DESMUME_JOBS: '3'
        run: |
          set -euo pipefail
          pacman -Q > native-toolchain.txt
          python _tests/release/pico_native_tests.py
          bash adapters/desmume-nds/build.sh 2>&1 | tee native-build.log
          python _tests/native/nds-mpcf-status.py
          python _tests/release/pico_native.py --platform windows --dll-directory /mingw64/bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pico-native-package-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pico-native-evidence-${{ matrix.platform }}
          path: |
            native-build.log
            native-toolchain.txt
          if-no-files-found: warn
