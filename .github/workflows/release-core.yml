name: Release Pico storage cores

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable fork tag (1.1.0-pico.N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pico-core-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^1\.1\.0-pico\.[1-9][0-9]*$ ]]
          revision=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          test "$revision" = "$(git rev-parse HEAD)"
          python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml","rb"))["package"]["version"] == os.environ["RELEASE_TAG"]'
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/core-validation.yml
    with:
      revision: ${{ needs.resolve.outputs.revision }}
      version: ${{ inputs.tag }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: core-*
          merge-multiple: true
          path: packages
      - name: Verify and publish fork core packages
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --prerelease \
            --title "Pico storage core $RELEASE_TAG" --notes-file ../FORK.md \
            ./*.zip ./*.tar.gz ./*.json ./*.sha256 ./SHA256SUMS
