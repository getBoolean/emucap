name: Input Lab native contract
on:
  push:
    paths: ['_tests/input-lab/**', '.github/workflows/input-lab.yml']
  pull_request:
    paths: ['_tests/input-lab/**', '.github/workflows/input-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python -m unittest discover -s _tests/input-lab -v
        env:
          CC: gcc
