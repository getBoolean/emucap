name: Validate emulator bridges

on:
  push:
    paths:
      - 'adapters/azahar/**'
      - 'adapters/libretro/**'
      - 'adapters/eden-family/**'
      - 'adapters/ryujinx-family/**'
      - 'adapters/_common/**'
      - '_tests/emulator-bridges/**'
      - '_tests/live/emulator-family/**'
      - '_tests/release/package_core*'
      - '.github/workflows/emulator-bridge-validation.yml'
  pull_request:
    paths:
      - 'adapters/azahar/**'
      - 'adapters/libretro/**'
      - 'adapters/eden-family/**'
      - 'adapters/ryujinx-family/**'
      - 'adapters/_common/**'
      - '_tests/emulator-bridges/**'
      - '_tests/live/emulator-family/**'
      - '_tests/release/package_core*'
      - '.github/workflows/emulator-bridge-validation.yml'
  workflow_dispatch:
    inputs:
      proof:
        type: choice
        default: fast
        options: [fast, native-build, live-guest]
      fork:
        type: choice
        default: all
        options: [all, azahar, eden, eden-nx2, eglantine, ryubing]
      platform:
        type: choice
        default: linux
        options: [all, linux, windows, macos]
      system:
        description: System for the single-fork Linux live lane
        type: choice
        default: 3ds
        options: [3ds, switch, switch2]
      native_run:
        description: This repository's completed native-build run, required for live-guest
        type: string
        default: ''
      fixture_run:
        description: This repository's lawful source-built homebrew artifact run, required for live-guest
        type: string
        default: ''
      approve_indirect_media:
        description: Confirm review of the lawful Switch 2 ExeFS members and emulator config
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  fast:
    name: Synthetic ABI and authenticated protocol (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Install guest pixel witness test dependency
        run: python -m pip install Pillow==11.3.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify bounded managed native diagnostics
        run: dotnet run --project adapters/ryujinx-family/tests/managed-errors/managed-errors.csproj --configuration Release
      - name: Compile/load native ABIs and exercise authenticated producers
        if: runner.os != 'Windows'
        run: python _tests/emulator-bridges/fast.py --evidence evidence --cc cc --cxx c++
      - name: Compile/load Windows native ABIs and exercise authenticated producers
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python _tests/emulator-bridges/fast.py --evidence evidence --cc "$(cygpath -m /mingw64/bin/gcc.exe)" --cxx "$(cygpath -m /mingw64/bin/g++.exe)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bridge-fast-${{ matrix.os }}
          path: evidence/
          if-no-files-found: error

  native-build:
    name: Pinned source build (${{ matrix.fork }}, ${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.proof == 'native-build'
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2022' || matrix.platform == 'macos' && 'macos-14' || 'ubuntu-24.04' }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        fork: ${{ fromJSON(inputs.fork == 'all' && '["azahar","eden","eden-nx2","eglantine","ryubing"]' || format('["{0}"]', inputs.fork)) }}
        platform: ${{ fromJSON(inputs.platform == 'all' && '["linux","windows","macos"]' || format('["{0}"]', inputs.platform)) }}
        # The Ryubing recipe currently supports x86_64 Windows/Linux only.
        exclude:
          - fork: ryubing
            platform: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: matrix.fork == 'ryubing'
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config nasm glslang-tools \
            libasound2-dev libpulse-dev libudev-dev libvulkan-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libssl-dev zlib1g-dev libzstd-dev liblz4-dev \
            libopus-dev libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libboost-dev libfmt-dev libenet-dev \
            libusb-1.0-0-dev libsdl2-dev
          python -m pip install cmake==4.1.3 ninja==1.13.0
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install autoconf automake libtool boost ffmpeg fmt \
            glslang libusb nasm openssl@3 opus pkgconf sdl2 sdl3 zstd lz4 enet molten-vk
          python -m pip install cmake==4.1.3 ninja==1.13.0
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git base-devel autoconf automake libtool perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-nasm mingw-w64-x86_64-boost
            mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-fmt mingw-w64-x86_64-enet
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-SDL3 mingw-w64-x86_64-libusb
            mingw-w64-x86_64-lz4 mingw-w64-x86_64-opus mingw-w64-x86_64-zstd
            mingw-w64-x86_64-openssl mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-glslang
      - name: Build selected pin and persist build evidence
        if: runner.os != 'Windows'
        env:
          FORK: ${{ matrix.fork }}
        run: python _tests/emulator-bridges/native_build.py --fork "$FORK" --evidence evidence --jobs 2
      - name: Build selected Windows GNU pin and persist build evidence
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          FORK: ${{ matrix.fork }}
        run: python _tests/emulator-bridges/native_build.py --fork "$FORK" --evidence evidence --jobs 2
      - name: Preserve dependency/setup outcome when no recipe started
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
          FORK: ${{ matrix.fork }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p evidence
          python -c 'import json,os,pathlib; pathlib.Path("evidence/job-result.json").write_text(json.dumps({"proof_level":"native-build-job","fork":os.environ["FORK"],"platform":os.environ["PLATFORM"],"status":os.environ["BUILD_STATUS"],"live_qualified":False},indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-build-${{ matrix.fork }}-${{ matrix.platform }}
          path: evidence/
          if-no-files-found: error

  live-guest:
    name: Linux live guest witness (${{ inputs.fork }}, ${{ inputs.system }})
    if: github.event_name == 'workflow_dispatch' && inputs.proof == 'live-guest'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: inputs.fork == 'ryubing'
        with:
          dotnet-version: '10.0.x'
      - name: Require explicit Linux native and lawful guest artifact runs
        env:
          FORK: ${{ inputs.fork }}
          PLATFORM: ${{ inputs.platform }}
          NATIVE_RUN: ${{ inputs.native_run }}
          FIXTURE_RUN: ${{ inputs.fixture_run }}
          SYSTEM: ${{ inputs.system }}
          APPROVE_INDIRECT_MEDIA: ${{ inputs.approve_indirect_media }}
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json, os, pathlib
          ready = (os.environ['FORK'] != 'all' and os.environ['PLATFORM'] == 'linux'
                   and os.environ['NATIVE_RUN'].isdigit() and os.environ['FIXTURE_RUN'].isdigit()
                   and (os.environ['SYSTEM'] != 'switch2' or os.environ['APPROVE_INDIRECT_MEDIA'] == 'true'))
          if not ready:
              pathlib.Path('evidence/blocked.json').write_text(json.dumps({
                  'status': 'blocked', 'live_qualified': False,
                  'reason': 'Select one fork, Linux, and explicit native/lawful-homebrew artifact run IDs. '
                            'Switch 2 needs its own lawful target fixture and explicit reviewed-media approval.'}, indent=2))
              raise SystemExit('Missing live qualification prerequisites')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-build-${{ inputs.fork }}-linux
          path: native
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: emucap-lawful-${{ inputs.system }}
          path: fixture
          run-id: ${{ inputs.fixture_run }}
          github-token: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install Linux virtual-display qualification prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 libasound2t64 libpulse0 \
            libudev1 libgl1 libx11-6 libxext6 libxrandr2 libxcursor1 libxi6 libxinerama1 \
            libwayland-client0 libxkbcommon0 libssl3t64 libzstd1 liblz4-1 libopus0 \
            libavcodec60 libavfilter9 libavformat60 libavutil58 libswresample4 libswscale7
          python -m pip install Pillow==11.3.0
      - name: Build managed launch and Azahar supervision binaries
        run: cargo build --locked --release --bin emucap-mcp --bin emucap-azahar
      - name: Qualify actual guest pixels, controls and cleanup
        env:
          FORK: ${{ inputs.fork }}
          SYSTEM: ${{ inputs.system }}
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
          APPROVE_INDIRECT_MEDIA: ${{ inputs.approve_indirect_media }}
        run: |
          case "$FORK" in
            azahar) ;;
            ryubing) chmod +x native/payload/Ryujinx ;;
            *) chmod +x native/payload/eden-sdl ;;
          esac
          approval=()
          if [ "$APPROVE_INDIRECT_MEDIA" = true ]; then approval+=(--approve-indirect-media); fi
          xvfb-run -a python _tests/emulator-bridges/live.py --fork "$FORK" --system "$SYSTEM" \
            --native native --fixture fixture --output evidence "${approval[@]}"
      - name: Persist live job outcome even when asset admission fails
        if: always()
        env:
          LIVE_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence
          python -c 'import json,os,pathlib; pathlib.Path("evidence/job-result.json").write_text(json.dumps({"proof_level":"live-guest-job","status":os.environ["LIVE_STATUS"]},indent=2)+"\n")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: live-${{ inputs.fork }}-${{ inputs.system }}-linux
          path: evidence/
          if-no-files-found: error
